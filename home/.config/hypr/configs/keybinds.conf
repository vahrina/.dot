# -- presets --
# https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER
$scripts = $HOME/.config/hypr/scripts
$configs = $HOME/.config/hypr/configs
$files = thunar
$term = foot
$menu = rofi -show-icons -modi drun, run -show drun -theme $HOME/.config/rofi/config.rasi
$windowMenu = rofi -show-icons -modi window -show window -theme $HOME/.config/rofi/config.rasi

# -- main configuration --
# https://wiki.hyprland.org/Configuring/Binds/
bind = $mainMod, RETURN, exec, $term
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $files
bind = $mainMod, F, fullscreen
bind = $mainMod, TAB, exec, $menu
bind = $mainMod SHIFT, TAB, exec, $windowMenu
# logout
bind = $SUPER_CTRL, l, exec, hyprlock
# splitting/tiling/floating
bind = $mainMod, Z, layoutmsg, togglesplit
bind = $mainMod, T, settiled
bind = $mainMod, S, setfloating
# bind = $mainMod, space, exec,swaykbdd -n # switch kb layout

# move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# resize panels
bind = $mainMod SHIFT, l, resizeactive, 50 0
bind = $mainMod SHIFT, h, resizeactive, -50 0
bind = $mainMod SHIFT, k, resizeactive, 0 -50
bind = $mainMod SHIFT, j, resizeactive, 0 50

# volume & media control
bind = , XF86AudioRaiseVolume, exec,pactl set-sink-volume @DEFAULT_SINK@ +10%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s +15%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 15%-

# switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# move/resize windows with mainMod + LMB/RMB & dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# -- custom keybinds
bind = $mainMod, R, exec, $scripts/refresh.sh
# wallpaper switcher
bind = $mainMod, W, exec, $scripts/wallpaper-select.sh --next
bind = $mainMod SHIFT, W, exec, $scripts/wallpaper-select.sh --menu
# screenshots
bind = $mainMod, P, exec, hyprshot -m region --clipboard-only
bind = $mainMod SHIFT, P, exec, hyprshot -m window --clipboard-only
# clipboard
bind = $mainMod, V, exec, $term --app-id clipse -e clipse
# waybar
bind = $mainMod, B, exec, $scripts/waybar-layout.sh
bind = $mainMod SHIFT, B, exec, $scripts/waybar-styles.sh
# swaync
bind = $mainMod, N, exec, swaync-client -t -sw
