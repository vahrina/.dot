"$schema" = 'https://starship.rs/config-schema.json'

# inspo: https://starship.rs/presets/pure-preset

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$golang\
$nodejs\
$rust\
$docker_context\
$character"""

# top prompt, user, dir, dur
[character]
success_symbol = "[❯](fg:#8fa8c8)"
error_symbol = "[❯](fg:#ffb5a7)"
vimcmd_symbol = "[❮](fg:#8a9bb5)"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "fg:#8fa8c8"

[directory]
style = "bright-black"
home_symbol = "η"

[cmd_duration]
format = "[$duration]($style) "
style = "bright-black"
show_milliseconds = false

# git related

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "fg:#b0c4de"
conflicted = ""
untracked = ""
modified = ""
staged = ""
renamed = ""
deleted = ""
stashed = "= "
ahead = "+${count} "
behind = "-${count} "
diverged = "+${ahead_count}-${behind_count} "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# languages
[python]
format = '[$virtualenv$symbol]($style) '
symbol = "🐍"
style = "fg:#a8e6a3"
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "Pipfile"]

[golang]
format = '[$symbol]($style) '
symbol = "🐹"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

[nodejs]
format = '[$symbol]($style) '
symbol = "📦"
detect_extensions = ["js", "ts", "mjs", "cjs"]
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[rust]
format = '[$symbol]($style) '
symbol = "🦀"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[docker_context]
format = '[$symbol$context]($style) '
symbol = "🐳"
style = "fg:#a8d8ea"
only_with_files = true
