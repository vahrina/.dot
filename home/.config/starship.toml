"$schema" = 'https://starship.rs/config-schema.json'

# inspo: https://starship.rs/presets/pure-preset

format = """
$username\
$hostname\
${custom.ip}\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$golang\
$nodejs\
$rust\
$docker_context\
$character"""

# --- top prompt, user, dir, dur
[character]
success_symbol = "[:](fg:#a8e6a3)"
error_symbol = "[!](fg:#ffb5a7)"

[username]
show_always = true
format = "[$user]($style)"
style_user = "fg:#a8e6a3"
style_root = "fg:#ffb5a7"


[hostname]
ssh_only = false
format = "[@$hostname]($style)"
style = "fg:#a8e6a3"

[custom.ip]
command = "ip -4 addr show eth0 | grep -oP '(?<=inet )[^/]+' | cut -d. -f4"
when = "true"
format = "[.${output}]($style) "
style = "bright-black"
[directory]
style = "bright-black"
home_symbol = "π"

[cmd_duration]
format = "[$duration]($style) "
style = "bright-black"
show_milliseconds = false

# --- git related
[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "fg:#d4c5e2"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡ "
ahead = "+${count} "
behind = "-${count} "
diverged = "+${ahead_count}-${behind_count} "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# --- languages
[python]
format = '[$virtualenv$symbol]($style) '
symbol = "🐍"
style = "fg:#a8e6a3"
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "Pipfile"]

[golang]
format = '[$symbol]($style) '
symbol = "🐹"
# style = "fg:#a8d8ea"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

[nodejs]
format = '[$symbol]($style) '
symbol = "📦"
# style = "fg:#ffd989"
detect_extensions = ["js", "ts", "mjs", "cjs"]
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[rust]
format = '[$symbol]($style) '
symbol = "🦀"
# style = "fg:#ffb5a7"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[docker_context]
format = '[$symbol$context]($style) '
symbol = "🐳"
style = "fg:#a8d8ea"
only_with_files = true
