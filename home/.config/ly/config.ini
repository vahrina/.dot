# ly supports 24-bit true color with styling, which means each color is a 32-bit value
# format: 0xSSRRGGBB (SS -> styling, RR -> red, GG -> green; BB -> blue), options:
# TB_BOLD      0x01000000
# TB_UNDERLINE 0x02000000
# TB_REVERSE   0x04000000
# TB_ITALIC    0x08000000
# TB_BLINK     0x10000000
# TB_HI_BLACK  0x20000000
# TB_BRIGHT    0x40000000
# TB_DIM       0x80000000
# programmatically, you'd apply them using the bitwise OR operator (|), but because ly's
# configuration doesn't support using it, you have to manually compute the color value
# note that, if you want to use the default color value of the terminal, you can use the
# special value 0x00000000. this means that, if you want to use black, you *must* use
# the styling option TB_HI_BLACK (the RGB values are ignored when using this option)

# -- colors
# render true colors (if supported)
# if false, output will be in eight color mode
# all eight color mode color codes:
# TB_DEFAULT              0x0000
# TB_BLACK                0x0001
# TB_RED                  0x0002
# TB_GREEN                0x0003
# TB_YELLOW               0x0004
# TB_BLUE                 0x0005
# TB_MAGENTA              0x0006
# TB_CYAN                 0x0007
# TB_WHITE                0x0008
# if full color is off, the styling options still work. The colors are 32-bit values styling in msb
full_color = true
fg = 0x00FFFFFF
bg = 0x00000000
border_fg = 0x00FFFFFF
error_fg = 0x03CC0000
error_bg = 0x00000000


# -- auth / password
allow_empty_password = false
clear_password = true
auth_fails = 2
# character used to mask the password (null: hidden), options:
# UTF-8 character (like *)
# UTF-32 codepoint (f.e. 0x2022 = bullet point)
# escape characters also work, e.g. # -> \#
asterisk = *


# -- info line / top bar
# primary battery is usually BAT0 or BAT1
# if set to null, battery status won't be shown
battery_id = BAT0

# if set to null, the info line defaults to the hostname
initial_info_text = null

# -- clock
# change the state & language of the clock
# none -> disabled
# en   -> english
# fa   -> farsi
bigclock = en
bigclock_12hr = true
bigclock_seconds = true

# format string for clock in top right corner (see strftime)
clock = %H:%M:%S


# -- controls
# brightness
brightness_down_cmd = /usr/bin/brightnessctl -q -n s 10%-
brightness_up_cmd = /usr/bin/brightnessctl -q -n s +10%
brightness_down_key = F3
brightness_up_key = F4
# restarting
restart_cmd = /sbin/shutdown -r now
restart_key = F2
# shutdown
shutdown_cmd = /sbin/shutdown -a now
shutdown_key = F1
# sleep (can be null)
sleep_cmd = null
sleep_key = F5


# -- ui / layout
# false will make the main box bg transparent
blank_box = true
box_title = null
margin_box_h = 2
margin_box_v = 1
text_in_center = true
hide_borders = false
hide_key_hints = true
hide_version_string = true
# input box active by default (info_line, session, login, password)
default_input = password
input_len = 32


# -- system behavior
# event timeout in ms
min_refresh_delta = 5
numlock = false
lang = en
vi_mode = true
vi_default_mode = normal
# default path (null: ly doesn't set a path)
path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
# save the current desktop & login as defaults, and load them on startup
save = true


# -- login / pam
# command executed when logging in, (important:) code must end with `exec "$@"`
# (optional) env vars will persist until logout
login_cmd = null
login_defs_path = /etc/login.defs
# service name (set to ly to use the provided pam config file)
service_name = ly


# -- logging
ly_log = /var/log/ly.log

# this will contain stdout & stderr of Wayland sessions (null: no session log)
# due to technical limitations, X11 & shell sessions aren't supported
session_log = ly-session.log


# -- sessions directory (multiple directories possible, colon separated)
waylandsessions = /usr/share/wayland-sessions
xsessions = /usr/share/xsessions
custom_sessions = /etc/ly/custom-sessions

# -- setup commands
setup_cmd = /etc/ly/setup.sh
# xorg
x_cmd = /usr/bin/X
xauth_cmd = /usr/bin/xauth
# xinitrc (null: session will be hidden)
xinitrc = ~/.xinitrc


# -- active animation
# none
# doom
# matrix
# colormix
# gameoflife
animation = colormix

# stop the animation after 1..2e12 many seconds (0 -> run forever)
animation_timeout_sec = 0

# ~~ cmatrix
# fg color
cmatrix_fg = 0x0000FF00
cmatrix_head_col = 0x01FFFFFF
# min animation codepoint(s) (16-bit integer)
# for f.e. japanese characters, use 0x3000
cmatrix_min_codepoint = 0x21
cmatrix_max_codepoint = 0x7B

# ~~ colormix
colormix_col1 = 0x00FF3A3A
colormix_col2 = 0x003A7BFF
colormix_col3 = 0x00E6E6E6

# ~~ DOOM
# 1-9
doom_fire_height = 6
# 0-4
doom_fire_spread = 2
# colors
doom_top_color = 0x009F2707
doom_middle_color = 0x00C78F17
doom_bottom_color = 0x00FFFFFF

# ~~ game of life
# entropy interval (0 = disabled, >0 = add entropy every N generations)
# 0 -> pure conway's GoL (will eventually stabilize)
# 10 -> add entropy every 10 generations (recommended for continuous activity)
# 50+ -> less frequent entropy for more natural evolution
gameoflife_entropy_interval = 10
gameoflife_fg = 0x0000FF00

# frame delay (lower = faster animation, higher = slower)
# 1-3 -> very fast animation
# 6 -> default smooth animation speed
# 10+ -> slower, more contemplative speed
gameoflife_frame_delay = 6

# initial cell density (0.0 to 1.0)
# 0.1 -> sparse, minimal activity
# 0.4 -> balanced activity (recommended)
# 0.7+ -> dense, chaotic patterns
gameoflife_initial_density = 0.4

