# ly supports 24-bit true color with styling, which means each color is a 32-bit value
# format: 0xSSRRGGBB, 
# -> SS is styling
# -> RR is red, GG green; BB blue
# possible styling options:
# TB_BOLD      0x01000000
# TB_UNDERLINE 0x02000000
# TB_REVERSE   0x04000000
# TB_ITALIC    0x08000000
# TB_BLINK     0x10000000
# TB_HI_BLACK  0x20000000
# TB_BRIGHT    0x40000000
# TB_DIM       0x80000000
# programmatically, you'd apply them using the bitwise OR operator (|), but because Ly's
# configuration doesn't support using it, you have to manually compute the color value
# Note that, if you want to use the default color value of the terminal, you can use the
# special value 0x00000000. This means that, if you want to use black, you *must* use
# the styling option TB_HI_BLACK (the RGB values are ignored when using this option)

# allow empty password or not when authenticating
allow_empty_password = false

# --- Active Animation ---
# none
# doom     	-> PSX DOOM fire
# matrix   	-> CMatrix
# colormix 	-> Color mixing shader
# gameoflife 	-> John Conway's Game of Life
animation = colormix 

# Stop the animation after some time
# 0 -> Run forever
# 1..2e12 -> Stop the animation after this many seconds
animation_timeout_sec = 0

# character used to mask the password
# options:
# -> type it directly as a UTF-8 character (like *)
# -> use a UTF-32 codepoint (f.e. 0x2022 = bullet point)
# if null, the password will be hidden
# note: you can use a # by escaping it like so: \#
asterisk = * 

# number of fail authentications before a special animation is played
auth_fails = 2

# primary battery is usually BAT0 or BAT1
# if set to null, battery status won't be shown
battery_id = BAT0

# background color id
bg = 0x00000000

# change the state & language of the clock
# none -> disabled
# en   -> english
# fa   -> farsi
bigclock = en

# set to 12-hour notation
bigclock_12hr = true
bigclock_seconds = false

# setting to false will make the main box bg transparent
blank_box = true

# border foreground color id
border_fg = 0x00FFFFFF

# title to show at the top of the main box
box_title = null

# brightness controls
brightness_down_cmd = /usr/bin/brightnessctl -q -n s 10%-
brightness_up_cmd = /usr/bin/brightnessctl -q -n s +10%
brightness_down_key = F3
brightness_up_key = F4

# erase password input on failure
clear_password = true

# format string for clock in top right corner (see strftime specification). Example: %c
clock = null

# --- CMatrix ---
# animation fg color id
cmatrix_fg = 0x0000FF00

# animation character string head color id
cmatrix_head_col = 0x01FFFFFF

# animation minimum codepoint (16-bit integer)
# for f.e. japanese characters, use 0x3000
cmatrix_min_codepoint = 0x21

# animation maximum codepoint (16-bit integer)
# for f.e. japanese characters, use 0x30FF
cmatrix_max_codepoint = 0x7B

# --- Colormix ---
# animation first, second, third color id
colormix_col1 = 0x00FF3A3A
# default: 0x00FF0000
colormix_col2 = 0x003A7BFF
# default: 0x000000FF
colormix_col3 = 0x00E6E6E6
# default: 0x20000000

# custom sessions directory (multiple directories possible)
# e.g. /etc/ly/custom-sessions:/usr/share/custom-sessions
custom_sessions = /etc/ly/custom-sessions

# input box active by default
# available inputs: info_line, session, login, password
default_input = password 

# --- DOOM ---
# animation fire height (1-9)
doom_fire_height = 6

# animation fire spread (0-4)
doom_fire_spread = 2

# animation custom top color (low intensity flames)
doom_top_color = 0x009F2707

# animation custom middle color (medium intensity flames)
doom_middle_color = 0x00C78F17

# animation custom bottom color (high intensity flames)
doom_bottom_color = 0x00FFFFFF

# error background color id
error_bg = 0x00000000

# error foreground color id
error_fg = 0x03CC0000

# foreground color id
fg = 0x00FFFFFF

# Render true colors (if supported)
# If false, output will be in eight-color mode
# All eight-color mode color codes:
# TB_DEFAULT              0x0000
# TB_BLACK                0x0001
# TB_RED                  0x0002
# TB_GREEN                0x0003
# TB_YELLOW               0x0004
# TB_BLUE                 0x0005
# TB_MAGENTA              0x0006
# TB_CYAN                 0x0007
# TB_WHITE                0x0008
# If full color is off, the styling options still work. The colors are
# always 32-bit values with the styling in the most significant byte.
full_color = true

# --- Game of Life ---
# entropy interval (0 = disabled, >0 = add entropy every N generations)
# 0 -> pure conway's GoL (will eventually stabilize)
# 10 -> add entropy every 10 generations (recommended for continuous activity)
# 50+ -> less frequent entropy for more natural evolution
gameoflife_entropy_interval = 10

# animation foreground color id
gameoflife_fg = 0x0000FF00

# frame delay (lower = faster animation, higher = slower)
# 1-3 -> very fast animation
# 6 -> default smooth animation speed
# 10+ -> slower, more contemplative speed
gameoflife_frame_delay = 6

# initial cell density (0.0 to 1.0)
# 0.1 -> sparse, minimal activity
# 0.4 -> balanced activity (recommended)
# 0.7+ -> dense, chaotic patterns
gameoflife_initial_density = 0.4

# --- Ly settings ---
# main box borders
hide_borders = false

# power management command hints
hide_key_hints = false

# version number in top left
hide_version_string = true

# initial text to show on the info line
# if set to null, the info line defaults to the hostname
initial_info_text = null

# input boxes length
input_len = 32 

# active language (/etc/ly/lang/)
lang = en

# command executed when logging in
# important: the code itself must end with `exec "$@"` in order to launch the session!
# optionally set env vars, they'll persist until logout
login_cmd = null

# path for login.defs (used for listing all local users on the system)
login_defs_path = /etc/login.defs

# ommand executed when logging out
# important: the session will already be terminated when this command is executed, no need to add `exec "$@"` at the end
logout_cmd = null

# log file path
ly_log = /var/log/ly.log

# main box horizontal margin
margin_box_h = 2

# main box vertical margin
margin_box_v = 1

# event timeout in ms
min_refresh_delta = 5

# numlock on/off at startup
numlock = false

# default path (if null, ly doesn't set a path)
path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# command executed when pressing restart_key
restart_cmd = /sbin/shutdown -r now
restart_key = F2

# save the current desktop & login as defaults, and load them on startup
save = true

# service name (set to ly to use the provided pam config file)
service_name = ly

# this will contain stdout and stderr of Wayland sessions
# by default it's saved in the user's home directory
# if null, no session log will be created
# important: due to technical limitations, X11 and shell sessions aren't supported, which
# means you won't get any logs from those sessions.
session_log = ly-session.log

# setup command
setup_cmd = /etc/ly/setup.sh

# command executed when pressing shutdown_key
shutdown_cmd = /sbin/shutdown -a now
shutdown_key = F1 

# command executed when pressing sleep key (can be null)
sleep_cmd = null
sleep_key = F5

# center the session name
text_in_center = true

# default vi mode
# normal   -> normal mode
# insert   -> insert mode
vi_default_mode = normal
vi_mode = true

# wayland desktop environments (multiple directories possible)
# e.g. /usr/share/wayland-sessions:/usr/local/share/wayland-sessions
waylandsessions = /usr/share/wayland-sessions

# xorg server command
x_cmd = /usr/bin/X

# xorg xauthority edition tool
xauth_cmd = /usr/bin/xauth

# xinitrc
# if null, then xinitrc session will be hidden
xinitrc = ~/.xinitrc

# xorg desktop environments (multiple directories possible)
# e.g. /usr/share/xsessions:/usr/local/share/xsessions
xsessions = /usr/share/xsessions

